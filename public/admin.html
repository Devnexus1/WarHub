<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>پنل مدیریت | WARHUB</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#050505">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--p:rgba(22,10,12,.72);--p2:rgba(255,255,255,.035);--bd:rgba(255,60,75,.2);--r:#b40d1c;--r2:#ff2b3b;--glow:rgba(255,30,45,.3);--t:#f4eeed;--m:#a99a99;--ok:#2ee59d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;background:radial-gradient(800px 500px at 90% -10%,var(--w1,rgba(180,13,28,.3)),transparent),radial-gradient(600px 400px at 0 100%,var(--w2,rgba(120,10,20,.2)),transparent),var(--bg);color:var(--t);min-height:100vh;line-height:1.7}
[hidden]{display:none!important}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.mu{color:var(--m)}.rd{color:var(--r2)}
.logo{font-weight:900;font-size:1.35rem;letter-spacing:.5px}.logo b{color:var(--r2)}
/* inputs */
.in{width:100%;margin-top:6px;padding:11px 14px;background:rgba(0,0,0,.45);border:1px solid var(--bd);border-radius:12px;outline:0;transition:.2s}
.in:focus{border-color:var(--r2);box-shadow:0 0 0 3px var(--glow)}
.in:-webkit-autofill{-webkit-text-fill-color:var(--t);box-shadow:0 0 0 40px #1a0b0d inset}
textarea.in{min-height:84px;resize:vertical}select.in option{background:#140809}
.f{display:block;font-size:.84rem;color:var(--m);margin-top:14px}
.ltr{direction:ltr;text-align:left}
/* buttons */
.b{border:0;border-radius:12px;padding:10px 20px;font-weight:700;background:linear-gradient(135deg,var(--r),var(--r2));box-shadow:0 6px 22px -6px var(--glow);transition:.2s}
.b:hover{transform:translateY(-1px);filter:brightness(1.12)}.b:disabled{opacity:.5}
.b.g{background:var(--p2);border:1px solid var(--bd);box-shadow:none}.b.d{background:transparent;border:1px solid var(--r2);color:var(--r2);box-shadow:none}
.b.ok{background:linear-gradient(135deg,#119e69,var(--ok));color:#04130d}.b.s{padding:6px 14px;font-size:.82rem;border-radius:10px}
/* login */
.lw{min-height:100vh;display:grid;place-items:center;padding:20px}
.lc{width:100%;max-width:400px;padding:34px;border-radius:24px;border:1px solid var(--bd);background:var(--p);backdrop-filter:blur(14px);box-shadow:0 30px 80px -30px #000,0 0 60px -20px var(--glow);text-align:center}
.lc .f{text-align:right}.pw{position:relative;display:block}.pw .in{padding-left:44px}
.pw button{position:absolute;left:10px;top:50%;transform:translateY(-30%);background:none;border:0;font-size:1.1rem;opacity:.7}
.er{color:var(--r2);font-size:.88rem;margin-top:12px}.lc .b{width:100%;margin-top:18px;padding:13px}
/* shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sd{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:22px;background:var(--p);border-left:1px solid var(--bd);backdrop-filter:blur(14px)}
.sd .logo{padding:0 8px}.sd .logo em{font-style:normal;font-size:.62rem;margin-inline-start:6px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--r2)}
#tabs{display:flex;flex-direction:column;gap:6px;flex:1}
#tabs button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:none;border:1px solid transparent;color:var(--m);text-align:right;transition:.2s}
#tabs button svg{width:19px;height:19px;flex:none}#tabs button:hover{background:var(--p2);color:var(--t)}
#tabs button.on{color:#fff;background:linear-gradient(135deg,rgba(180,13,28,.55),rgba(255,43,59,.25));border-color:var(--bd);box-shadow:0 0 24px -8px var(--glow)}
.bdg{margin-inline-start:auto;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--r2);color:#fff;font-size:.74rem;display:grid;place-items:center;font-weight:700}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--p2);border:1px solid var(--bd)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--r),var(--r2));text-transform:uppercase}
.me div{flex:1;min-width:0}.me b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me small{color:var(--m);font-size:.74rem}
.mn{min-width:0}.tp{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:16px 28px;background:rgba(7,7,10,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.tp h1{font-size:1.25rem}#mb{display:none;background:var(--p2);border:1px solid var(--bd);border-radius:10px;width:40px;height:40px;font-size:1.2rem}
#view{padding:28px;max-width:1150px}
/* cards */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
.st{padding:20px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(255,43,59,.12),var(--p2))}
.st b{display:block;font-size:2.1rem;line-height:1.2}.st span{color:var(--m);font-size:.85rem}
.pn,.it{padding:18px;border-radius:18px;border:1px solid var(--bd);background:var(--p);margin-bottom:14px}
.pn h3{margin-bottom:4px}.pn.n{border-color:var(--r2);box-shadow:0 0 26px -10px var(--glow)}
.hd{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.it p{margin:8px 0 12px;white-space:pre-wrap;line-height:1.9}
.tg{font-size:.74rem;padding:3px 11px;border-radius:99px;border:1px solid var(--bd);color:var(--m)}
.ac{display:flex;gap:8px;flex-wrap:wrap}.ti{font-size:1.5rem;margin:0 0 18px;display:flex;align-items:center;gap:10px}
.sec{margin:26px 0 12px;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:18px;background:var(--p)}
table{width:100%;border-collapse:collapse}th,td{padding:13px 16px;text-align:right;border-bottom:1px solid var(--bd);font-size:.9rem;white-space:nowrap}th{color:var(--m);font-weight:600}tr:last-child td{border:0}
.rw{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;padding:14px;border-radius:16px;border:1px solid var(--bd);background:var(--p);margin-bottom:10px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}.fm .f{margin:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.em{padding:34px;text-align:center;color:var(--m);border:1px dashed var(--bd);border-radius:18px}
/* toast + modal */
#ts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px}
.to{padding:12px 20px;border-radius:14px;background:#160a0c;border:1px solid var(--bd);box-shadow:0 10px 40px #000;animation:up .25s}.to.e{border-color:var(--r2)}.to.k{border-color:var(--ok)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
#md{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);padding:20px}
#md div{max-width:380px;width:100%;padding:26px;border-radius:20px;background:#140809;border:1px solid var(--bd);text-align:center}#md p{margin-bottom:18px}#md .ac{justify-content:center}
.ut td{white-space:normal;vertical-align:middle}.ut td.nw{white-space:nowrap}
.ut .pc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:180px;max-width:380px}.ut .pc .tg{margin:0!important;white-space:nowrap}
.ut select.in{min-width:175px;font-size:.84rem}.pprow[hidden]{display:none!important}
@media(max-width:760px){.ut,.ut tbody,.ut tr{display:block;width:100%}.ut tr:first-child{display:none}.ut tr{padding:12px 14px;border-bottom:1px solid var(--bd)}.ut td{display:flex;gap:12px;align-items:center;justify-content:space-between;border:0;padding:7px 0;width:100%}.ut td[data-l]::before{content:attr(data-l);color:var(--m);font-size:.78rem;flex:none}.ut .pc{justify-content:flex-end;min-width:0;max-width:none}.ut select.in{min-width:0;flex:1;max-width:210px}.ut tr.pprow{padding:0 0 12px}.ut tr.pprow td{display:block;padding:0}}
@media(max-width:860px){.app{grid-template-columns:1fr}.sd{position:fixed;z-index:40;right:0;width:270px;transform:translateX(100%);transition:.25s}.sd.open{transform:none}#mb{display:block}.tp,#view{padding-inline:16px}}

/* v2: themes, dashboard, toolbars, command palette */
#tabs button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--r) 55%,transparent),color-mix(in srgb,var(--r2) 25%,transparent))}
.st{background:linear-gradient(160deg,color-mix(in srgb,var(--r2) 14%,transparent),var(--p2))}
button:focus-visible,.in:focus-visible{outline:2px solid var(--r2);outline-offset:2px}
[data-th=light]{--bg:#f6f2f2;--p:rgba(255,255,255,.92);--p2:rgba(0,0,0,.045);--t:#1c1416;--m:#6d5f61;color-scheme:light}
[data-th=light] .in{background:#fff}[data-th=light] .tp{background:rgba(246,242,242,.85)}
[data-th=light] #md>div,[data-th=light] .to,[data-th=light] .kp{background:#fff}[data-th=light] select.in option{background:#fff}
[data-th=light] .b:not(.g):not(.d):not(.ok),[data-th=light] .av,[data-th=light] #tabs button.on{color:#fff}[data-th=light] .in:-webkit-autofill{box-shadow:0 0 0 40px #fff inset}
.pref{display:flex;gap:8px;align-items:center;padding:0 8px}.dot{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid transparent;background:hsl(var(--h) 90% 50%)}.dot.on{border-color:var(--t)}.pref .th{margin-inline-start:auto;width:34px;padding:4px 0}
.tp #kb kbd{opacity:.6;font-size:.7rem;margin-inline-start:6px}
.gr{margin-bottom:20px}.gr h2{font-size:1.45rem}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}.dg .pn{margin:0}
.st[data-go]{cursor:pointer;transition:.2s}.st[data-go]:hover{border-color:var(--r2);transform:translateY(-2px)}
.hb{display:grid;grid-template-columns:90px 1fr 36px;gap:10px;align-items:center;margin-top:10px;font-size:.85rem}.hb div{height:10px;border-radius:99px;background:var(--p2);overflow:hidden}.hb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--r),var(--r2))}
.dn{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;flex:none}.dn span{width:82px;height:82px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:900;font-size:1.25rem}
.at{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-top:8px;border-radius:14px;background:var(--p2);border:1px solid var(--bd);text-align:right}.at:hover{border-color:var(--r2)}.at b{margin-inline-start:auto;color:var(--r2);font-size:1.2rem}
.fd{display:flex;gap:10px;font-size:.84rem;padding:8px 0;border-bottom:1px dashed var(--bd)}.fd:last-child{border:0}.fd time{margin-inline-start:auto;color:var(--m);white-space:nowrap}
.tb{align-items:center}.chips{display:flex;gap:6px;flex-wrap:wrap}.ch{padding:6px 14px;border-radius:99px;background:var(--p2);border:1px solid var(--bd);color:var(--m);font-size:.84rem}.ch i{font-style:normal;margin-inline-start:6px;color:var(--r2)}.ch.on{color:var(--t);border-color:var(--r2);background:color-mix(in srgb,var(--r2) 18%,transparent)}
.pb{height:6px;border-radius:99px;background:var(--p2);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--r),var(--r2))}
#kp{position:fixed;inset:0;z-index:70;display:grid;align-items:start;justify-items:center;padding:12vh 16px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.kp{width:100%;max-width:520px;border-radius:20px;border:1px solid var(--bd);background:#140809;overflow:hidden;box-shadow:0 30px 80px #000}.kp input{width:100%;padding:16px 20px;background:none;border:0;border-bottom:1px solid var(--bd);outline:0;font-size:1rem}
.kp ul{list-style:none;max-height:50vh;overflow:auto;padding:8px}.kp li{padding:11px 14px;border-radius:12px;cursor:pointer;display:flex;gap:10px}.kp li.on{background:color-mix(in srgb,var(--r2) 20%,transparent)}.kp li small{margin-inline-start:auto;color:var(--m)}
@media(max-width:860px){.tp #kb kbd{display:none}}
html,body{overflow-x:hidden}
.sd{height:100vh;height:100dvh;overflow:hidden;gap:14px}
#tabs{min-height:0;overflow-y:auto;gap:4px;scrollbar-width:thin}#tabs button{padding:10px 14px}
.sd .logo,.pref,.me{flex:none}.me .av{flex:none}.me #out{width:34px;height:34px;padding:0;flex:none;font-size:1rem}
@media(max-height:760px){.sd{padding:14px 12px;gap:10px}#tabs button{padding:8px 12px}}
.tp #kb{display:flex;align-items:center;gap:8px;white-space:nowrap}.tp #kb kbd{margin:0;font-family:inherit}
.fd{flex-wrap:wrap}.fd b{order:1}.fd time{order:2;margin-inline-start:auto}.fd span{order:3;flex:1 1 100%;unicode-bidi:plaintext;overflow-wrap:anywhere;color:var(--m)}
.sd,.kp ul,.tw{scrollbar-width:thin}
#ntp{margin-top:12px}
.fm{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:stretch}.fm>.f{display:flex;flex-direction:column;justify-content:space-between}
input[type=color].in{height:46px;padding:4px;cursor:pointer}
input[type=file].in{padding:8px 12px}input[type=file].in::file-selector-button{margin-inline-end:12px;border:0;border-radius:8px;padding:6px 14px;background:var(--r);color:#fff;font:inherit;cursor:pointer}
.rpv{border-radius:16px;padding:14px 16px;margin-top:18px;border:1px solid var(--bd);border-inline-start:6px solid var(--c);background:var(--p2)}.rpv>div{display:flex;gap:10px;align-items:center}.rpv p{color:var(--m);font-size:.85rem;margin-top:4px}
.mt{height:6px;border-radius:99px;background:var(--p2);margin-top:8px;overflow:hidden}.mt i{display:block;height:100%;width:0;transition:.25s}
.pf{display:flex;gap:14px;align-items:center}.pf .av{width:54px;height:54px;font-size:1.4rem;flex:none}
.fm{align-items:start}.fm>.f{justify-content:flex-start}.fm>button{align-self:end;height:46px;padding-block:0}
.ch[data-amt]{font-size:.75rem;padding:3px 10px;white-space:nowrap}
.ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}.ag>.pn{max-width:none!important;margin:0!important}.ag>.pn:first-child{grid-column:1/-1}
#pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}#pr>.pn{margin:0!important}#pr>p{grid-column:1/-1}

/* mobile: smaller, denser UI */
.dg{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.ag{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}#pr{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
@media(max-width:640px){
html{font-size:14px}
.tp{padding:9px 12px;gap:10px}.tp h1{font-size:1.05rem}#mb{width:36px;height:36px}.tp #kb{padding:5px 10px;font-size:.78rem}
#view{padding:14px 12px}.sd{width:236px}
.sg{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.st{padding:12px 14px;border-radius:14px}.st b{font-size:1.5rem}.st span{font-size:.76rem}
.pn,.it{padding:13px;border-radius:14px;margin-bottom:10px}.dg,.ag{gap:10px}
.b{padding:8px 15px;border-radius:10px}.b.s{padding:5px 11px;font-size:.78rem}.in{padding:9px 12px;border-radius:10px}.fm>button{height:40px}
.fm{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}.fm .f,.f{font-size:.78rem;margin-top:10px}
.tb .in,.bar .in{min-width:0!important;flex:1 1 100%!important;max-width:none!important}.bar{gap:8px;margin:12px 0}
.ch{padding:4px 11px;font-size:.78rem}.ti{font-size:1.15rem}.gr h2{font-size:1.15rem}.sec{font-size:.95rem}
th,td{padding:9px 10px;font-size:.8rem}.tg{font-size:.68rem;padding:2px 8px}
.dn{width:88px;height:88px}.dn span{width:62px;height:62px;font-size:1rem}.hb{grid-template-columns:68px 1fr 28px;font-size:.8rem}
.rw{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));padding:10px;gap:8px}.at{padding:10px 12px}.fd{font-size:.78rem}
.lc{padding:24px 18px;border-radius:20px}#md div{padding:18px}.kp input{padding:13px 16px}#kp{padding-top:7vh}
#ts{width:calc(100% - 24px);bottom:14px}.to{padding:10px 14px;font-size:.85rem}
}
/* iPad / tablet: icon rail instead of drawer (641-1100px), touch targets, iOS fixes */
body{padding-inline:env(safe-area-inset-left) env(safe-area-inset-right)}
.sd{padding-bottom:calc(14px + env(safe-area-inset-bottom))}#ts{bottom:calc(14px + env(safe-area-inset-bottom))}
@media(min-width:641px) and (max-width:1100px){
.app{grid-template-columns:72px 1fr}
.sd{position:sticky;top:0;right:auto;width:72px;transform:none;padding:14px 8px;align-items:center;gap:12px;z-index:6}
.sd .logo{font-size:0;padding:0}.sd .logo::before{content:"⚔";font-size:1.5rem}.sd .logo b,.sd .logo em{display:none}
#tabs{width:100%;align-items:center}#tabs button{position:relative;justify-content:center;width:48px;padding:12px}#tabs button span{display:none}
#tabs button .bdg{position:absolute;top:0;inset-inline-start:0;min-width:18px;height:18px;font-size:.65rem;padding:0 4px}
.pref{display:grid;grid-template-columns:repeat(2,20px);gap:8px;padding:0}.pref .th{grid-column:1/-1;width:100%;margin:0}
.me{flex-direction:column;padding:8px 4px;gap:8px}.me div:not(.av){display:none}
#mb{display:none}.tp{padding:12px 22px}#view{padding:22px;max-width:none}
.sg{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.st b{font-size:1.8rem}
.fm{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
}
@media(pointer:coarse){.b.s{min-height:38px}.ch{min-height:36px}.dot{width:26px;height:26px}#tabs button{min-height:44px}input[type=checkbox]{width:20px;height:20px}}
@media(max-width:640px){.in,.kp input,select.in,textarea.in{font-size:16px}}
</style>
</head>
<body>
<div class="lw" id="login">
 <div class="lc">
  <div class="logo">⚔ WAR<b>HUB</b></div>
  <p class="mu" id="lt" style="margin-top:6px">ورود به پنل مدیریت</p>
   <div class="pn" id="phb" hidden style="margin:16px 0;padding:14px"></div>
  <label class="f">نام کاربری<input class="in ltr" id="lu" autocomplete="username"></label>
  <label class="f">رمز عبور<span class="pw"><input class="in ltr" id="lp" type="password" autocomplete="current-password"><button type="button" id="eye" aria-label="نمایش رمز">👁</button></span></label>
  <label class="f" id="lcw" hidden>تکرار رمز عبور<input class="in ltr" id="lc" type="password" autocomplete="new-password"></label>
  <label class="f" id="lkw" hidden>کد راه‌اندازی (از فایل data/setup-code.txt)<input class="in ltr" id="lk" autocomplete="off"></label>
  <p class="er" id="le" hidden></p>
  <button class="b" id="lb" type="button">ورود</button>
 </div>
</div>
<div class="app" id="app" hidden>
 <aside class="sd" id="sd">
  <div class="logo">⚔ WAR<b>HUB</b><em>ADMIN</em></div>
  <nav id="tabs"></nav>
  <div class="pref"><button class="dot" data-h="355" style="--h:355" aria-label="تم قرمز" type="button"></button><button class="dot" data-h="215" style="--h:215" aria-label="تم آبی" type="button"></button><button class="dot" data-h="270" style="--h:270" aria-label="تم بنفش" type="button"></button><button class="dot" data-h="38" style="--h:38" aria-label="تم کهربایی" type="button"></button><button class="b g s th" id="thm" type="button" aria-label="تم روشن/تاریک">◐</button></div>
  <div class="me"><div class="av" id="av"></div><div><b id="who"></b><small id="role"></small></div><button class="b g s" id="out" type="button" title="خروج" aria-label="خروج از پنل">⏻</button></div>
 </aside>
 <main class="mn"><header class="tp"><button id="mb" type="button">☰</button><h1 id="pt"></h1><button class="b g s" id="kb" type="button" style="margin-inline-start:auto">🔍 جستجوی سریع<kbd class="ltr">Ctrl K</kbd></button></header><div id="view"></div></main>

  let phs = null;
  function phoneBox() {

        (r.pending ? '<label class="f">کد<input class="in ltr" id="phc" autocomplete="off"></label><label class="f">رمز جدید (حداقل ۸ کاراکتر)<input class="in ltr" id="phn" type="password" autocomplete="new-password"></label>' : '<label class="f">رمز<input class="in ltr" id="php" type="password" autocomplete="current-password"></label>') +

    });
  }
  $(document).on('click', '#phgo', () => {

  });

    $('#who').text(u.u); $('#role').text(ROLES[u.r].split(' ')[0]); $('#av').text(u.u[0]);
    $('#tabs').html(TABS.filter(t => !t[2] || [].concat(t[2]).some(k => u.perms.includes(k))).map(t => `<button type="button" data-t="${t[0]}" title="${t[1]}" aria-label="${t[1]}">${IC[t[0]]}<span>${t[1]}</span>${t[0] === 'reviews' || t[0] === 'wallet' ? `<i class="bdg" data-b="${t[0]}" hidden></i>` : ''}</button>`).join(''));
    go('dash'); badge();
  }
  function badge() { if (!me.perms.includes('content') && !me.perms.includes('wallet')) return; api('GET', 'stats').done(s => { pend = s.counts.pending; document.title = (pend ? '(' + fa(pend) + ') ' : '') + 'پنل مدیریت | WARHUB'; const set = (k, n) => $(`.bdg[data-b=${k}]`).text(fa(n)).prop('hidden', !n); set('reviews', pend); set('wallet', s.counts.walletPending || 0); }); }

  $(document).ajaxError((e, x, o) => { if (x.status === 401 && !/login|setup/.test(o.url)) showLogin(); });
  $('#tabs').on('click', 'button', function () { go($(this).data('t')); });
  $('#mb').on('click', () => $('#sd').toggleClass('open'));
  let setup = false;
  const sw = on => { setup = on; $('#lt').text(on ? 'اولین ورود: حساب مدیر را بسازید' : 'ورود به پنل مدیریت'); $('#lcw,#lkw').prop('hidden', !on); $('#lb').text(on ? 'ساخت حساب و ورود' : 'ورود'); $('#lp').attr('autocomplete', on ? 'new-password' : 'current-password'); };
  $('#eye').on('click', () => $('#lp,#lc').attr('type', $('#lp').attr('type') === 'password' ? 'text' : 'password'));

  };

  $('#login').on('keydown', 'input', function (e) { if (e.key === 'Enter') login(); }); // never return false here: it blocks typing

  const csv = (name, rows) => { const t = '\ufeff' + rows.map(r => r.map(c => { const v = String(c == null ? '' : c); return '"' + (/^[=+\-@]/.test(v) ? "'" + v : v).replace(/"/g, '""') + '"'; }).join(',')).join('\r\n'), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = name + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  const genPw = () => { const c = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%', a = new Uint32Array(14); crypto.getRandomValues(a); return Array.from(a, x => c[x % c.length]).join(''); };
  const PR = { g: (k, d) => { try { return localStorage.getItem('wh_' + k) || d; } catch (e) { return d; } }, s: (k, v) => { try { localStorage.setItem('wh_' + k, v); } catch (e) {} } };
  const look = () => { const h = +PR.g('hue', 355), st = document.documentElement.style, c = (sa, l, a) => `hsl(${h} ${sa}% ${l}%${a == null ? '' : ' / ' + a})`;

  look();
  $(document).on('click', '.dot', function () { PR.s('hue', $(this).data('h')); look(); }).on('click', '#thm', () => { PR.s('th', PR.g('th', 'dark') === 'dark' ? 'light' : 'dark'); look(); })
    .on('click', '[data-go]', function () { go($(this).data('go')); }).on('keydown', '.st[data-go]', e => { if (e.key === 'Enter') $(e.currentTarget).click(); })

  $('#kb').on('click', palette);
  setInterval(() => { if (me && !$('#app').prop('hidden')) badge(); }, 60000);
  function palette() {

    const pick = j => { const x = items[j]; if (x) { m.remove(); x.run(); } };
    inp.on('input', function () {
      const q = this.value.trim().toLowerCase(); i = 0; clearTimeout(tm);
      items = nav.concat(acts).filter(x => x.n.toLowerCase().includes(q)); draw();
      if (pTab && q.length >= 2) tm = setTimeout(() => api('GET', 'players?q=' + encodeURIComponent(q)).done(L => { if (inp.val().trim().toLowerCase() !== q) return; items = items.concat(L.slice(0, 5).map(p => ({ n: (p.name || 'بدون نام') + ' · ' + p.phone, k: 'بازیکن', run: () => { go(pTab); $(pTab === 'players' ? '#pq' : '#nq').val(p.phone).trigger('input'); } }))); draw(); }), 250);
    }).on('keydown', e => {

    });
    m.on('click', e => { if (e.target === m[0]) m.remove(); }); ul.on('click', 'li[data-i]', function () { pick(+$(this).data('i')); }); draw(); inp.focus();

  const VIEWS = {
    dash() {
      api('GET', 'stats').done(s => {

        $('#ngp').on('click', () => $('#np').val(genPw()));
        $('#cpinv').on('click', function () { const c = String($(this).data('c')); (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(() => toast('کد کپی شد ✓', 'k'), () => toast('کپی نشد؛ کد را دستی انتخاب کن', 'e')); });
        $('#nap').on('click', () => { const ph = $('#nph').val().trim().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); if (!/^09\d{9}$/.test(ph)) return toast('شماره را به شکل 09123456789 وارد کن', 'e'); api('POST', 'users', { phone: ph, r: $('#nrp').val() }).done(d => { lastInv = d; go('users'); }).fail(err); });
        $('#na').on('click', () => api('POST', 'users', { u: $('#nu').val(), p: $('#np').val(), r: $('#nr').val() }).done(() => { toast('مدیر جدید ساخته شد ✓', 'k'); go('users'); }).fail(err));
        V.find('[data-d]').on('click', async function () { if (await ask('این مدیر حذف شود؟')) api('DELETE', 'users/' + $(this).data('d')).done(() => go('users')).fail(err); });
        V.find('[data-r]').on('change', function () { api('PATCH', 'users/' + $(this).data('r'), { r: this.value }).done(() => { toast('نقش تغییر کرد ✓ (دسترسی‌ها به پیش‌فرض نقش برگشت)', 'k'); go('users'); }).fail(x => { err(x); go('users'); }); });
        const panel = id => V.find('.pprow').filter(function () { return $(this).data('for') === id; });
        V.find('[data-pp]').on('click', function () { panel($(this).data('pp')).prop('hidden', (_, h) => !h); });
        V.find('[data-all]').on('click', function () { panel($(this).data('all')).find('input[data-k]').prop('checked', true); });
        V.find('[data-save]').on('click', function () { const id = $(this).data('save'); api('PATCH', 'users/' + id, { perms: panel(id).find('input[data-k]:checked').map(function () { return $(this).data('k'); }).get() }).done(() => { toast('دسترسی‌ها ذخیره شد ✓', 'k'); go('users'); }).fail(err); });
        V.find('[data-def]').on('click', function () { const id = $(this).data('def'); api('PATCH', 'users/' + id, { perms: null }).done(() => { toast('به پیش‌فرض نقش برگشت ✓', 'k'); go('users'); }).fail(err); });
      });
    },
    players() {
      let tm = null, meta = null; V.off('click');
      V.html(`<div class="pn"><h3>رنک و دستاورد بازیکنان</h3>
        <p class="mu" style="margin-top:6px;font-size:.85rem">بازیکن را پیدا کن؛ سپس رنکش را تعیین کن یا یک دستاورد برایش ثبت کن. رنکی که اینجا می‌دهی «حداقل رنک» او می‌شود و با بردهای بعدی بالاتر هم می‌رود.</p>
        <label class="f">بازیکن (نام کاربری، شماره موبایل یا شناسه)<input class="in" id="pq" autocomplete="off"></label></div><div id="pr"></div>`);
      const card = p => {
        const rk = meta.canRank ? `<div class="fm" style="margin-top:10px"><label class="f">رنک<select class="in" data-rk="${esc(p.phone)}"><option value="">بدون رنک دستی</option>${meta.ranks.map((n, i) => i ? `<option value="${i}" ${p.granted === i ? 'selected' : ''}>${esc(n)}</option>` : '').join('')}</select></label><button class="b s" data-setrk="${esc(p.phone)}" type="button">ثبت رنک</button></div>` : '';
        const ac = meta.canAch ? `<div style="margin-top:12px">${meta.achievements.map(a => `<div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span>${a.icon} ${esc(a.title)}</span><span class="tg">${fa(a.reward)} تومان</span>${p.ach.includes(a.key) ? '<span class="tg" style="border-color:var(--ok);color:var(--ok)">دارد ✓</span>' + (meta.canPay && a.reward > 0 && !a.each ? ` <button class="b g s" data-gift="${esc(p.phone)}|${esc(a.key)}" type="button">شارژ هدیه</button>` : '') : `<button class="b g s" data-ach="${esc(p.phone)}|${a.key}" type="button">ثبت دستاورد</button>`}</div>`).join('')}
          ${meta.canPay ? '<label class="f" style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" class="pay" style="width:18px;height:18px;accent-color:var(--r2)"> هدیه‌ی نقدی دستاورد هم به کیف پول بازیکن اضافه شود</label>' : '<p class="mu" style="font-size:.8rem;margin-top:10px">پرداخت هدیه‌ی نقدی فقط با دسترسی «کیف پول» ممکن است؛ دستاورد بدون پول ثبت می‌شود.</p>'}</div>` : '';
        return `<div class="pn" style="margin-top:14px" data-p="${esc(p.phone)}"><div class="hd"><b>${esc(p.name || 'بدون نام')}</b><span class="tg ltr">${esc(p.phone)}</span><span class="tg">${fa(p.wins)} برد</span><span class="tg">رنک فعلی: ${esc(p.rank)}</span></div>${rk}${ac}</div>`;
      };
      const show = d => { meta = d; $('#pr').html(d.players.length ? d.players.map(card).join('') : '<p class="mu" style="margin-top:14px">بازیکنی پیدا نشد (حداقل ۲ حرف بنویس).</p>'); };
      $('#pq').on('input', function () { clearTimeout(tm); const q = this.value.trim(); if (q.length < 2) return $('#pr').empty(); tm = setTimeout(() => api('GET', 'pmanage?q=' + encodeURIComponent(q)).done(show).fail(err), 300); });
      const refresh = (ph, p) => { const old = V.find('[data-p]').filter(function () { return $(this).data('p') === ph; }); old.replaceWith(card(p)); };
      V.on('click', '[data-setrk]', function () { const ph = $(this).data('setrk'), v = V.find('[data-rk]').filter(function () { return $(this).data('rk') === ph; }).val(); api('POST', `pmanage/${ph}/rank`, { rank: v === '' ? null : +v }).done(r => { toast('رنک ثبت شد ✓', 'k'); refresh(ph, r.player); }).fail(err); });
      V.on('click', '[data-gift]', async function () {
        const [ph, key] = String($(this).data('gift')).split('|'), a = meta.achievements.find(x => x.key === key); if (!a) return;
        if (!await ask('هدیهٔ «' + a.title + '» (' + fa(a.reward) + ' تومان) الان به کیف پول این بازیکن اضافه شود؟ فقط اگر قبلاً شارژ نشده بزن، وگرنه دوبار شارژ می‌شود.')) return;
        api('POST', 'wallet/adjust', { to: ph, amount: +a.reward, dir: 'in', bucket: 'won', note: 'هدیه دستاورد: ' + a.title }).done(() => toast('هدیه به کیف پول اضافه شد ✓', 'k')).fail(err);
      });
      V.on('click', '[data-ach]', async function () {
        const [ph, key] = String($(this).data('ach')).split('|'), pay = $(this).closest('[data-p]').find('.pay').is(':checked');
        if (await ask(pay ? 'دستاورد به همراه هدیه‌ی نقدی برای این بازیکن ثبت شود؟' : 'دستاورد (بدون پول) برای این بازیکن ثبت شود؟')) api('POST', `pmanage/${ph}/ach`, { key, pay }).done(r => { toast(pay ? 'دستاورد ثبت شد؛ موجودی بازیکن را در کیف پول چک کن ✓' : 'دستاورد ثبت شد ✓', 'k'); refresh(ph, r.player); }).fail(err);
      });
    },
    audit() {
      api('GET', 'audit').done(L => {
        let q = '', u = ''; const users = [...new Set(L.map(x => x.u))];
        V.html(`<div class="bar tb"><input class="in" id="aq" placeholder="جستجو در عملیات…" style="width:auto;flex:1;min-width:180px;margin:0"><select class="in" id="au" style="width:auto;margin:0"><option value="">همه‌ی مدیران</option>${users.map(x => `<option>${esc(x)}</option>`).join('')}</select><span class="mu" id="acn"></span><button class="b g s" id="acsv" type="button">خروجی CSV</button></div><div class="tw"><table><thead><tr><th>زمان</th><th>کاربر</th><th>عملیات</th></tr></thead><tbody id="ab"></tbody></table></div>`);
        const vis = () => L.filter(x => (!u || x.u === u) && (!q || (x.a + ' ' + x.u).toLowerCase().includes(q)));
        const draw = () => { const A = vis(); $('#ab').html(A.map(x => `<tr><td class="mu">${dt(x.at)}</td><td>${esc(x.u)}</td><td>${esc(x.a)}</td></tr>`).join('') || '<tr><td colspan="3" class="mu">موردی پیدا نشد</td></tr>'); $('#acn').text(fa(A.length) + ' مورد'); };
        draw();
        $('#aq').on('input', function () { q = this.value.trim().toLowerCase(); draw(); }); $('#au').on('change', function () { u = this.value; draw(); });
        $('#acsv').on('click', () => csv('audit', [['زمان', 'کاربر', 'عملیات']].concat(vis().map(x => [dt(x.at), x.u, x.a]))));
      });
    },
    me() {
      V.html(`<div class="ag"><div class="pn" style="max-width:480px"><div class="pf"><div class="av">${esc(me.u[0])}</div><div><h3>${esc(me.u)}</h3><p class="mu" style="font-size:.85rem">${esc(ROLES[me.r])}</p></div></div><div class="ac" style="margin-top:12px">${me.perms.map(k => `<span class="tg">${esc((PERM_LABELS[k] || k).split(' (')[0].replace(' ⚠️', ''))}</span>`).join('')}</div></div><div class="pn" style="max-width:480px"><h3>تغییر نام کاربری</h3><p class="mu" style="font-size:.85rem">نام فعلی: <b id="cuName"></b></p><label class="f">نام کاربری جدید (انگلیسی، ۳ تا ۳۰ حرف)<input class="in ltr" id="nuName" autocomplete="off"></label><label class="f">رمز فعلی (برای تأیید)<input class="in ltr" id="nuPass" type="password" autocomplete="current-password"></label><div class="bar"><button class="b" id="nuSave" type="button">ذخیره نام کاربری</button></div></div><div class="pn" style="max-width:480px;margin-top:18px"><h3>تغییر رمز عبور</h3><label class="f">رمز فعلی<input class="in ltr" id="po" type="password"></label><label class="f">رمز جدید (حداقل ۸ کاراکتر)<input class="in ltr" id="pw" type="password"><div class="mt"><i id="pwm"></i></div><small class="mu" id="pwt">قدرت رمز</small></label><div class="bar"><button class="b" id="ps" type="button">ذخیره</button><button class="b g" id="pg" type="button">ساخت رمز قوی</button><button class="b g" id="pv" type="button">نمایش رمز</button></div></div></div>`);
      api('GET', 'me').done(d => $('#cuName').text(d.u));
      $('#pw').on('input', function () { const v = this.value, n = (v.length >= 8) + (v.length >= 12) + (/[a-z]/.test(v) && /[A-Z]/.test(v)) + /\d/.test(v) + /[^\w]/.test(v), c = ['#ff2b3b', '#ff2b3b', '#ffb02e', '#e8d84a', '#2ee59d', '#2ee59d'][n]; $('#pwm').css({ width: v ? n * 20 + '%' : 0, background: c }); $('#pwt').text(v ? ['خیلی ضعیف', 'ضعیف', 'متوسط', 'خوب', 'قوی', 'عالی'][n] : 'قدرت رمز'); });
      $('#pg').on('click', () => $('#pw').attr('type', 'text').val(genPw()).trigger('input'));
      $('#pv').on('click', function () { const h = $('#pw').attr('type') === 'password'; $('#pw').attr('type', h ? 'text' : 'password'); $(this).text(h ? 'پنهان کردن رمز' : 'نمایش رمز'); });
      $('#nuSave').on('click', () => api('POST', 'username', { u: $('#nuName').val().trim(), p: $('#nuPass').val() }).done(d => { toast('نام کاربری تغییر کرد ✓', 'k'); $('#cuName').text(d.u); $('#nuName,#nuPass').val(''); $('#who').text(d.u); $('#av').text(d.u[0]); }).fail(err));
      $('#ps').on('click', () => api('POST', 'password', { old: $('#po').val(), new: $('#pw').val() }).done(() => { toast('رمز تغییر کرد ✓', 'k'); $('#po,#pw').val(''); }).fail(err));
    }
  };
  api('GET', 'me').done(start).fail(showLogin);
})(jQuery);
</script>
</body>
</html>
